{% extends "base.html" %}
{% block title %}Customer sign in | Habi Jabi{% endblock %}
{% block head %}
<style>
    .auth-card { width: min(440px, 100%); margin: 22px auto; padding: 26px; }
    .auth-card h1 { margin: 0 0 7px; font-size: 23px; }
    .auth-card > p { margin: 0 0 20px; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form input { width: 100%; padding: 12px; border: 1px solid #dfe1e5; border-radius: 6px; }
    .auth-form input:focus { outline: 1px solid var(--orange); border-color: var(--orange); }
    .auth-form .button-primary { width: 100%; }
</style>
{% endblock %}
{% block content %}
<section class="auth-card panel">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to see your orders and continue shopping.</p>
    <form class="auth-form" method="post" action="{{ url_for('login', next=next_url) if next_url else url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" autocomplete="email" required placeholder="Email address">
        <input type="password" name="password" autocomplete="current-password" required placeholder="Password">
        <button class="button-primary" type="submit">Sign in</button>
    </form>
    <p class="muted" style="margin:18px 0 0">New here? <a href="{{ url_for('register') }}" style="color:var(--orange);font-weight:700">Create an account</a></p>
</section>
{% endblock %}
